# Rendered at container start by the stock nginx image (envsubst over
# /etc/nginx/templates → conf.d). Only vars set in the container env are
# substituted (PANEL_HTTPS_PORT); nginx's own $host/$uri stay untouched.

# HTTP → HTTPS redirect. Port = the HOST-side HTTPS port (.env PANEL_HTTPS_PORT),
# since nginx itself always listens on 443 inside the container; $host drops
# the port the client typed, so add ours back (":443" is normalised by browsers).
server {
    listen 80;
    server_name _;
    return 301 https://$host:${PANEL_HTTPS_PORT}$request_uri;
}

# HTTPS panel. Cert/key come from the shared volume the backend writes
# (/etc/nginx/certs); the entrypoint reloads nginx when they change.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
