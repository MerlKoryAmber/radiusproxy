services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: radpanel
      POSTGRES_PASSWORD: radpanel
      POSTGRES_DB: radpanel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radpanel"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://radpanel:radpanel@db:5432/radpanel
      CORS_ORIGINS: http://localhost:8080
      # FreeRADIUS runs in this container; the panel writes straight into its
      # real config tree and validates/reloads it.
      PROXY_CONF_PATH: /etc/freeradius/3.0/proxy.conf
      CLIENTS_CONF_PATH: /etc/freeradius/3.0/clients.conf
      LDAP_CONF_PATH: /etc/freeradius/3.0/mods-enabled/ldap
      LDAP_CA_PATH: /etc/freeradius/3.0/certs/ad-ca.pem
      POLICY_CONF_PATH: /etc/freeradius/3.0/policy.d/radiuspanel
      SQL_CONF_PATH: /etc/freeradius/3.0/mods-enabled/sql
      RADIUS_CHECK_CMD: "freeradius -XC"
      RADIUS_RELOAD_CMD: "/usr/local/bin/radius-reload.sh"
      # Secrets at rest are encrypted with this key. CHANGE for production
      # (a long random string); if it changes, stored secrets can't be decrypted.
      APP_ENCRYPTION_KEY: "dev-insecure-change-me"
      JWT_SECRET: "dev-insecure-change-me"
    ports:
      - "8000:8000"
      - "1812:1812/udp"
      - "1813:1813/udp"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
