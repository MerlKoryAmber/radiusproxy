services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: radpanel
      POSTGRES_PASSWORD: radpanel
      POSTGRES_DB: radpanel
      # Containers must NOT use any host HTTP proxy — outbound traffic stays local.
      no_proxy: "*"
      NO_PROXY: "*"
      http_proxy: ""
      https_proxy: ""
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radpanel"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      # Proxy for apt-get/pip during the image BUILD only (empty when no proxy).
      # apply_docker_proxy (scripts/lib/docker-proxy.sh) exports these; Compose
      # substitutes them here. Runtime proxy stays OFF via `environment:` below.
      args:
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-}"
        http_proxy: "${HTTP_PROXY:-}"
        https_proxy: "${HTTPS_PROXY:-}"
        no_proxy: "${NO_PROXY:-}"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://radpanel:radpanel@db:5432/radpanel
      CORS_ORIGINS: https://localhost
      # FreeRADIUS runs in this container; the panel writes straight into its
      # real config tree and validates/reloads it.
      PROXY_CONF_PATH: /etc/freeradius/3.0/proxy.conf
      CLIENTS_CONF_PATH: /etc/freeradius/3.0/clients.conf
      LDAP_CONF_PATH: /etc/freeradius/3.0/mods-enabled/ldap
      LDAP_CA_PATH: /etc/freeradius/3.0/certs/ad-ca.pem
      POLICY_CONF_PATH: /etc/freeradius/3.0/policy.d/radiuspanel
      SQL_CONF_PATH: /etc/freeradius/3.0/mods-enabled/sql
      RADIUSD_CONF_PATH: /etc/freeradius/3.0/radiusd.conf
      RADIUS_CHECK_CMD: "freeradius -XC"
      RADIUS_RELOAD_CMD: "/usr/local/bin/radius-reload.sh"
      # Panel HTTPS cert/key are written here (shared with the frontend nginx).
      TLS_CERT_DIR: /certs
      # Secrets at rest are encrypted with this key. CHANGE for production
      # (a long random string); if it changes, stored secrets can't be decrypted.
      # Override via .env (or `rpp secrets`); dev default used when unset.
      APP_ENCRYPTION_KEY: "${APP_ENCRYPTION_KEY:-dev-insecure-change-me}"
      JWT_SECRET: "${JWT_SECRET:-dev-insecure-change-me}"
      # Host IPs + hostname shown read-only in Settings (install.sh fills these
      # via .env; inside a container `hostname` is the container id, not the host).
      HOST_ADDRESSES: "${HOST_ADDRESSES:-}"
      HOST_HOSTNAME: "${HOST_HOSTNAME:-}"
      # No host proxy inside the container.
      no_proxy: "*"
      NO_PROXY: "*"
      http_proxy: ""
      https_proxy: ""
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
    volumes:
      - panelcerts:/certs
    ports:
      - "8000:8000"
      - "1812:1812/udp"
      - "1813:1813/udp"

  frontend:
    build:
      context: ./frontend
      # Proxy for npm during the image BUILD only (empty when no proxy set).
      args:
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-}"
        http_proxy: "${HTTP_PROXY:-}"
        https_proxy: "${HTTPS_PROXY:-}"
        no_proxy: "${NO_PROXY:-}"
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      no_proxy: "*"
      NO_PROXY: "*"
      http_proxy: ""
      https_proxy: ""
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
    volumes:
      - panelcerts:/etc/nginx/certs
    ports:
      - "80:80"
      - "443:443"

volumes:
  pgdata:
  panelcerts:
